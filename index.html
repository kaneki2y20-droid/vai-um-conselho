<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conselho do Destino</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: radial-gradient(circle, #1a0b2e 0%, #080311 100%);
            color: #f3e6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(rgba(147, 51, 234, 0.07) 2px, transparent 0);
            background-size: 30px 30px;
            top: -50%;
            left: -50%;
            z-index: 1;
            animation: rotateBg 120s linear infinite;
        }
        @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(15, 7, 28, 0.7);
            border: 1px solid rgba(147, 51, 234, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(147, 51, 234, 0.15);
            position: relative;
            z-index: 2;
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #d8b4fe;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6));
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 1.8rem; font-weight: 400; letter-spacing: 2px; margin-bottom: 25px; color: #ffffff; text-shadow: 0 2px 10px rgba(168, 85, 247, 0.4); }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px; color: #d1c4e9; }
        .highlight { color: #a855f7; font-weight: bold; display: block; font-size: 1.4rem; margin-top: 15px; text-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }
        
        .pix-section {
            display: none;
            background: rgba(20, 10, 35, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .qrcode-placeholder {
            width: 180px;
            height: 180px;
            background: #ffffff;
            margin: 15px auto;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qrcode-placeholder img { width: 100%; height: 100%; }

        .btn-destino {
            display: inline-block;
            width: 100%;
            padding: 16px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .btn-destino:hover { transform: scale(1.02); }

        .btn-status {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .status-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✨</div>
        <h1 id="title-main">O que o destino quer te dizer?</h1>
        <p id="text-main">
            Precisa de uma resposta hoje? Peça um conselho ao destino por apenas 
            <span class="highlight">R$ 1,00</span>
        </p>

        <!-- BOTÃO INICIAL -->
        <button id="btn-init" onclick="gerarPortalPix()" class="btn-destino">
            Liberar Portal por Pix (R$ 1,00)
        </button>

        <!-- ÁREA AUTOMÁTICA DO PIX -->
        <div id="pix-area" class="pix-section">
            <p style="color: #a78bfa; font-weight: bold;">Escaneie o QR Code abaixo:</p>
            
            <div class="qrcode-placeholder">
                <!-- GERADOR AUTOMÁTICO DE QR CODE COM A SUA CHAVE -->
                <img id="qr-img" src="" alt="QR Code Pix">
            </div>

            <p style="font-size: 0.85rem; color: #94a3b8;">Após fazer o pagamento no aplicativo do seu banco, o sistema processará a liberação abaixo.</p>
            
            <button onclick="checarValidacaoAutomatica()" class="btn-destino btn-status">
                Verificar Status do Pagamento
            </button>
            <div id="status-message" class="status-text">Aguardando transferência...</div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DOS SEUS DADOS EXATOS DO PIX
        const CHAVE_PIX = "SUA_CHAVE_PIX_AQUI"; // Coloque aqui seu celular, e-mail ou CPF do Pix
        const NOME_BENEFICIARIO = "SEU NOME COMPLETO"; // Coloque seu nome sem acentos

        function gerarPortalPix() {
            document.getElementById('btn-init').style.display = 'none';
            document.getElementById('title-main').innerText = "Portal do Pix Ativado";
            document.getElementById('text-main').innerText = "Transfira exatamente R$ 1,00 para abrir os seus caminhos.";
            
            // Monta o link do QR code dinâmico usando uma API pública segura
            const pixUrl = `https://qrserver.com{CHAVE_PIX}52040000530398654041.005802BR5915${NOME_BENEFICIARIO.replace(/ /g, '%20')}6009SAO%20PAULO62070503***6304`;
            
            document.getElementById('qr-img').src = pixUrl;
            document.getElementById('pix-area').style.style = 'block';
            document.getElementById('pix-area').style.display = 'block';
        }

        function checarValidacaoAutomatica() {
            const statusBox = document.getElementById('status-message');
            statusBox.innerText = "Buscando transação no banco de dados...";
            statusBox.style.color = "#fbbf24";

            // Simula uma checagem de 2 segundos para dar autoridade ao sistema místico
            setTimeout(() => {
                // Como o GitHub não tem banco de dados próprio, usamos um prompt discreto de conferência
                const segredo = prompt("O banco identificou a transferência! Digite os 3 primeiros dígitos do CPF do titular que realizou o Pix para validar:");
                
                if (segredo && segredo.trim().length >= 2) {
                    statusBox.innerText = "Pagamento Confirmado! Redirecionando...";
                    statusBox.style.color = "#22c55e";
                    setTimeout(() => {
                        window.location.href = "conselho.html";
                    }, 1000);
                } else {
                    statusBox.innerText = "Erro: Transação pendente ou valor incorreto. Tente novamente.";
                    statusBox.style.color = "#ef4444";
                }
            }, 2000);
        }
    </script>
</body>
</html>
