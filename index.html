<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conselho do Destino</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: radial-gradient(circle, #1a0b2e 0%, #080311 100%);
            color: #f3e6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(rgba(147, 51, 234, 0.07) 2px, transparent 0);
            background-size: 30px 30px;
            top: -50%;
            left: -50%;
            z-index: 1;
            animation: rotateBg 120s linear infinite;
        }
        @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container {
            text-align: center;
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(15, 7, 28, 0.7);
            border: 1px solid rgba(147, 51, 234, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(147, 51, 234, 0.15);
            position: relative;
            z-index: 2;
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            color: #d8b4fe;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6));
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 1.8rem; font-weight: 400; letter-spacing: 2px; margin-bottom: 25px; color: #ffffff; text-shadow: 0 2px 10px rgba(168, 85, 247, 0.4); }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 35px; color: #d1c4e9; }
        .highlight { color: #a855f7; font-weight: bold; display: block; font-size: 1.4rem; margin-top: 15px; text-shadow: 0 0 8px rgba(168, 85, 247, 0.3); }
        .btn-destino {
            display: inline-block;
            width: 100%;
            padding: 16px 30px;
            background: linear-gradient(135deg, #6b21a8 0%, #4c1d95 100%);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            border: 1px solid rgba(233, 213, 255, 0.3);
            box-shadow: 0 4px 15px rgba(107, 33, 168, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-destino:hover { transform: scale(1.03); box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6); background: linear-gradient(135deg, #7e22ce 0%, #5b21b6 100%); }
        .btn-destino:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✨</div>
        <h1>O que o destino quer te dizer?</h1>
        <p>
            Precisa de uma resposta hoje? Peça um conselho ao destino por apenas 
            <span class="highlight">R$ 1,00</span>
        </p>
        <!-- ADICIONADO TARGET="_BLANK" E REL="NOREFERRER" PARA FORÇAR REDIRECIONAMENTO LIMPO -->
        <a href="https://mercadopago.com.br" target="_blank" rel="noopener noreferrer" class="btn-destino">
            Clique aqui para receber sua mensagem de superação ou amor
        </a>
    </div>
</body>
</html>
